<!doctype html><html lang=ar><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lark</title><style>
:root{--bg:#0c0b14;--card:#161426;--line:#25223c;--ac:#8b5cf6;--ac2:#ec4899;--tx:#f3f1ff;--mut:#9490b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:150px}
header{position:sticky;top:0;z-index:5;background:#0c0b14ee;backdrop-filter:blur(12px);padding:16px 16px 10px}
.top{display:flex;align-items:center;gap:10px}h1{margin:0;font-size:24px;flex:1;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:50%;width:42px;height:42px;font-size:18px}
#q{width:100%;margin-top:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:18px;padding:13px 16px;font-size:16px;outline:none}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto}.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);
border-radius:99px;padding:9px 18px;font-size:14px}.tabs .on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px}.row.on{background:#8b5cf61f}.row.on b{color:var(--ac)}
.cv{position:relative;flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3b2a78,#7a2b63);display:grid;place-items:center;overflow:hidden;font-size:22px}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m{flex:1;min-width:0}.m b,.m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m small,.row>small{color:var(--mut);font-size:13px;margin-top:3px}
.back{padding:14px 16px;color:var(--ac);font-weight:700}.empty{text-align:center;color:var(--mut);padding:60px 20px}
#mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#1c1936f2;backdrop-filter:blur(14px);
border:1px solid var(--line);border-radius:24px;padding:10px 12px;display:none;align-items:center;gap:12px;z-index:8;overflow:hidden}
#mini .cv{width:46px;height:46px;border-radius:12px}#pb{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.pl{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px}
.pl.sm{background:none;font-size:22px;width:36px}
#full{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 0,#3a2478,var(--bg) 65%);display:none;flex-direction:column;
padding:calc(20px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
#full .big{width:min(78vw,340px);aspect-ratio:1;margin:30px auto 24px;border-radius:32px;font-size:90px;box-shadow:0 20px 60px #0009}
#full h2{margin:0;font-size:22px;text-align:center}#full p{margin:6px 0 20px;color:var(--mut);text-align:center}
input[type=range]{width:100%;accent-color:var(--ac)}.tm{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.ctl button{background:none;border:0;color:var(--tx);font-size:28px}
.ctl .pl{width:72px;height:72px;font-size:30px}.ctl .on{color:var(--ac)}
</style></head><body>
<header><div class=top><h1>🎵 Lark</h1><button class=ib onclick=rescan()>🔄</button></div>
<input id=q placeholder="ابحث عن أغنية أو فنان..." oninput=render()>
<div class=tabs id=tabs></div></header>
<div id=list></div>
<div id=mini onclick=openFull()><div class=cv id=mc></div><div class=m><b id=mt></b><small id=ma></small></div>
<button class="pl sm" onclick="event.stopPropagation();prev()">⏮</button>
<button class=pl id=mp onclick="event.stopPropagation();toggle()">▶</button>
<button class="pl sm" onclick="event.stopPropagation();next()">⏭</button><div id=pb></div></div>
<div id=full><button class=ib onclick="full.style.display='none'">⌄</button>
<div class="cv big" id=fc></div><h2 id=ft></h2><p id=fa></p>
<input type=range id=sk min=0 max=1000 value=0><div class=tm><span id=t1>0:00</span><span id=t2>0:00</span></div>
<div class=ctl><button id=bs onclick=shuffle()>🔀</button><button onclick=prev()>⏮</button>
<button class=pl id=fp onclick=toggle()>▶</button><button onclick=next()>⏭</button><button id=br onclick=repeat()>🔁</button></div>
<div class=ctl style="justify-content:center"><button id=bf onclick=favToggle()>🤍</button></div></div>
<audio id=au></audio>
<script>
const $=i=>document.getElementById(i),A=$('au'),full=$('full');
let S=[],Q=[],qi=-1,cur=[],G=[],tab='songs',sub=null,shuf=false,rep=0,fav=JSON.parse(localStorage.fav||'[]');
const TABS=[['songs','الأغاني'],['artists','الفنانين'],['albums','الألبومات'],['fav','المفضلة ❤️']];
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cov=s=>'<span>♪</span><img src="/cover/'+s.id+'" onerror="this.remove()">';
const cvh=s=>'<div class=cv>'+cov(s)+'</div>';
function tabsR(){$('tabs').innerHTML=TABS.map(t=>'<button class="'+(t[0]==tab?'on':'')+'" onclick="tab=\''+t[0]+'\';sub=null;render()">'+t[1]+'</button>').join('')}
function render(){tabsR();const q=$('q').value.toLowerCase();let h='';
const mt=s=>(s.title+s.artist+s.album).toLowerCase().includes(q);
if((tab=='artists'||tab=='albums')&&!sub){const k=tab=='artists'?'artist':'album',g={};
S.filter(mt).forEach(s=>(g[s[k]]=g[s[k]]||[]).push(s));G=Object.entries(g).sort();
h=G.map(([n,l],i)=>'<div class=row onclick="openG('+i+')">'+cvh(l[0])+'<div class=m><b>'+esc(n)+'</b><small>'+l.length+' أغنية</small></div></div>').join('')}
else{let L=S.filter(mt);if(sub)L=L.filter(s=>s[sub.k]==sub.v);if(tab=='fav')L=L.filter(s=>fav.includes(s.path));cur=L;
h=(sub?'<div class=back onclick="sub=null;render()">← رجوع · '+esc(sub.v)+'</div>':'')+
L.map((s,i)=>'<div class="row '+(Q[qi]&&Q[qi].id==s.id?'on':'')+'" onclick="play('+i+')">'+cvh(s)+'<div class=m><b>'+esc(s.title)+'</b><small>'+esc(s.artist)+'</small></div><small>'+fmt(s.dur)+'</small></div>').join('')}
$('list').innerHTML=h||'<div class=empty>ما كاين والو هنا 🎧</div>'}
function openG(i){const k=tab=='artists'?'artist':'album';sub={k,v:G[i][0]};render()}
function play(i){Q=cur.slice();qi=i;load()}
function load(){const s=Q[qi];A.src='/audio/'+s.id;A.play();
['m','f'].forEach(p=>{$(p+'c').innerHTML=cov(s)});$('mt').textContent=$('ft').textContent=s.title;$('ma').textContent=$('fa').textContent=s.artist;
$('mini').style.display='flex';favUI();render();
if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:[{src:'/cover/'+s.id,sizes:'512x512'}]});
navigator.mediaSession.setActionHandler('nexttrack',next);navigator.mediaSession.setActionHandler('previoustrack',prev);
navigator.mediaSession.setActionHandler('play',()=>A.play());navigator.mediaSession.setActionHandler('pause',()=>A.pause())}}
function toggle(){A.paused?A.play():A.pause()}
function next(auto){if(!Q.length)return;if(shuf)qi=Math.floor(Math.random()*Q.length);else{qi++;if(qi>=Q.length){if(rep==1||!auto)qi=0;else{qi=Q.length-1;return}}}load()}
function prev(){if(!Q.length)return;if(A.currentTime>3){A.currentTime=0;return}qi=(qi-1+Q.length)%Q.length;load()}
function shuffle(){shuf=!shuf;$('bs').className=shuf?'on':''}
function repeat(){rep=(rep+1)%3;$('br').className=rep?'on':'';$('br').textContent=rep==2?'🔂':'🔁'}
function favUI(){const s=Q[qi];$('bf').textContent=s&&fav.includes(s.path)?'❤️':'🤍'}
function favToggle(){const s=Q[qi];if(!s)return;fav=fav.includes(s.path)?fav.filter(p=>p!=s.path):fav.concat(s.path);localStorage.fav=JSON.stringify(fav);favUI();render()}
function openFull(){full.style.display='flex'}
A.onplay=A.onpause=()=>{const i=A.paused?'▶':'⏸';$('mp').textContent=$('fp').textContent=i};
A.ontimeupdate=()=>{const r=A.currentTime/(A.duration||1);$('pb').style.width=r*100+'%';$('sk').value=r*1000;$('t1').textContent=fmt(A.currentTime);$('t2').textContent=fmt(A.duration)};
A.onended=()=>rep==2?(A.currentTime=0,A.play()):next(true);
$('sk').oninput=e=>A.currentTime=e.target.value/1000*(A.duration||0);
async function rescan(){$('list').innerHTML='<div class=empty>كنقلب على الأغاني...</div>';S=await(await fetch('/api/rescan')).json();render()}
(async()=>{S=await(await fetch('/api/songs')).json();render()})();
</script></body></html>
